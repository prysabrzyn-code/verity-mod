name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build mod
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: verity-jar
          path: build/libs/*.jar

      - name: Zip source
        run: zip -qr build/as-source.zip . -x '.git/*' 'build/*' '.gradle/*'

      - name: Publish release with jar and source
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-6
          name: Verity build 6
          files: |
            build/libs/*.jar
            build/as-source.zip
            extras/verity-factory-map-datapack.zip
          prerelease: true
          generate_release_notes: false
